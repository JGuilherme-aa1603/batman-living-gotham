plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def configuredModsDir = providers.gradleProperty('livingGothamModsDir')
        .orElse(providers.environmentVariable('LIVING_GOTHAM_MODS_DIR'))
        .getOrElse('Instancia/mods')
def localModsDir = file(configuredModsDir)

def requiredLocalMods = [
        yofadda_jar,
        create_jar,
        worldedit_jar,
        curios_jar,
        geckolib_jar,
        playeranimator_jar,
        tacz_jar
]

def localModCoordinates = [
        'local:batman_mod:1.0.9-forge-1.20.1',
        'local:worldedit-mod:7.2.15',
        'local:curios-forge:5.14.1+1.20.1',
        'local:geckolib-forge:1.20.1-4.8.4',
        'local:player-animation-lib-forge:1.0.2-rc1+1.20',
        'local:tacz:1.20.1-1.1.8-hotfix'
]

def localMod = { String jarName ->
    def jarFile = new File(localModsDir, jarName)
    if (!jarFile.isFile()) {
        throw new GradleException("Missing local development dependency: ${jarFile}. " +
                'Set LIVING_GOTHAM_MODS_DIR or -PlivingGothamModsDir without copying JARs into Git.')
    }
    return files(jarFile)
}

println "Gradle runtime: Java ${System.getProperty('java.version')} at ${System.getProperty('java.home')}"
println "Living Gotham local mods: ${localModsDir}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('runtime/forge')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            // Third-party production refmaps contain SRG names. ForgeGradle's userdev
            // runs use Mojmap names and need this runtime remapping file.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            def autoProbeMode = providers.gradleProperty('livingGothamAutoProbe').getOrElse('false')
            if (!autoProbeMode.equalsIgnoreCase('false')) {
                property 'livinggotham.autoProbe', 'true'
                property 'livinggotham.autoProbeMode', autoProbeMode
            }
            mods {
                living_gotham {
                    source sourceSets.main
                }
            }
        }
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Create'
        url = 'https://maven.createmod.net/'
        content {
            includeGroup 'com.simibubi.create'
            includeGroup 'dev.engine-room.flywheel'
            includeGroup 'dev.engine-room.vanillin'
            includeGroup 'net.createmod.ponder'
        }
    }
    maven {
        name = 'Registrate'
        url = 'https://maven.tterrag.com/'
        content {
            includeGroup 'com.tterrag.registrate'
        }
    }
    flatDir {
        name = 'localRuntimeMods'
        dirs localModsDir
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // The installed distribution JAR embeds production Ponder/Flywheel and cannot be used
    // directly in Mojmap userdev. Build 289 is the exact same Create Git commit.
    implementation fg.deobf("com.simibubi.create:create-1.20.1:${create_maven_version}:slim")
    implementation fg.deobf("com.tterrag.registrate:Registrate:MC1.20-1.3.3")
    implementation fg.deobf("net.createmod.ponder:Ponder-Forge-1.20.1:${ponder_version}")
    compileOnly fg.deobf("dev.engine-room.flywheel:flywheel-forge-api-1.20.1:${flywheel_version}")
    runtimeOnly fg.deobf("dev.engine-room.flywheel:flywheel-forge-1.20.1:${flywheel_version}")
    runtimeOnly fg.deobf("dev.engine-room.vanillin:vanillin-forge-1.20.1:${vanillin_version}")
    implementation 'io.github.llamalad7:mixinextras-forge:0.4.1'

    localModCoordinates.each { coordinates ->
        implementation fg.deobf(coordinates)
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version: forge_version,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title': mod_id,
                'Specification-Vendor': mod_authors,
                'Specification-Version': '1',
                'Implementation-Title': mod_name,
                'Implementation-Version': archiveVersion,
                'Implementation-Vendor': mod_authors
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.register('verifyLocalMods') {
    group = 'verification'
    description = 'Checks the external runtime dependencies without copying or packaging them.'
    doLast {
        requiredLocalMods.each { jarName ->
            localMod(jarName)
            println "found ${jarName}"
        }
    }
}

tasks.named('compileJava').configure { dependsOn 'verifyLocalMods' }
